version: 2
updates:
  # pnpm workspace — single root lockfile covers all packages/*
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
      day: 'monday'
      time: '09:00'
    groups:
      deps-minor-patch:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
      dev-deps-minor-patch:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
    open-pull-requests-limit: 10
    ignore:
      # TS 7 is a major compiler rewrite; breaks TypeDoc/Docusaurus build until deliberate migration.
      - dependency-name: 'typescript'
        versions:
          - '>=7.0.0'
      # Keep @types/node aligned with Node engine floor (^22). Majors widen typings beyond supported baseline.
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
    assignees:
      - 'Texarkanine'
    commit-message:
      prefix: 'fix'
      prefix-development: 'chore'
      include: 'scope'

  # GitHub Actions dependencies
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
      day: 'monday'
      time: '09:00'
    groups:
      github-actions-minor-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    open-pull-requests-limit: 5
    assignees:
      - 'Texarkanine'
    commit-message:
      prefix: 'chore(deps-ci)'
