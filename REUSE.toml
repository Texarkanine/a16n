version = 1
SPDX-PackageName = "a16n"
SPDX-PackageSupplier = "Texarkanine <texarkanine@protonmail.com>"

# Default: application code under AGPL-3.0-or-later
[[annotations]]
path = ["**/*"]
SPDX-FileCopyrightText = "Texarkanine"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Doc-site hand-written content (Docusaurus pages)
[[annotations]]
path = ["packages/docs/docs/**"]
precedence = "override"
SPDX-FileCopyrightText = "Texarkanine"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Agent customizations local to this repo: rules, skills, slash commands
[[annotations]]
path = [
    ".cursor/rules/**",
    ".cursor/skills/**",
    ".cursor/commands/**",
    ".claude/CLAUDE.md",
    ".claude/settings.json",
]
precedence = "override"
SPDX-FileCopyrightText = "Texarkanine"
SPDX-License-Identifier = "LicenseRef-PPL-S"

# The graphify skill is vendored verbatim from
# https://github.com/Graphify-Labs/graphify (Apache-2.0). Refreshed by
# `graphify install --project --platform claude`; do not hand-edit.
[[annotations]]
path = [".claude/skills/graphify/**"]
precedence = "override"
SPDX-FileCopyrightText = "Safi Shamsi and the Graphify contributors"
SPDX-License-Identifier = "Apache-2.0"

# Paths under **/shared/** are vendored from upstream
# with unknown or mixed licensing. No license claims are made for those files here.
[[annotations]]
path = [".cursor/**/shared/**"]
precedence = "override"
SPDX-FileCopyrightText = "NOASSERTION"
SPDX-License-Identifier = "LicenseRef-NOASSERTION"
